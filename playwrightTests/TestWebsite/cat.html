<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat SVG</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        svg {
            width: 300px;
            height: 300px;
        }
    </style>
</head>

<body>

    <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">

        <!-- Cat head -->
        <path
            d="M75 110 L65 45 L115 75
               Q150 55 185 75
               L235 45 L225 110
               Q245 145 225 185
               Q205 225 150 225
               Q95 225 75 185
               Q55 145 75 110Z"
            fill="#999"
            stroke="#333"
            stroke-width="5"
        />

        <!-- Eyes -->
        <circle cx="115" cy="135" r="12" fill="#222" />
        <circle cx="185" cy="135" r="12" fill="#222" />

        <!-- Nose -->
        <path
            d="M142 155 Q150 148 158 155 Q150 165 142 155Z"
            fill="#e88"
        />

        <!-- Mouth -->
        <path
            d="M150 163 Q150 180 135 180
               M150 163 Q150 180 165 180"
            fill="none"
            stroke="#333"
            stroke-width="4"
            stroke-linecap="round"
        />

        <!-- Whiskers -->
        <path d="M105 160 L45 150" stroke="#333" stroke-width="3" />
        <path d="M105 170 L40 175" stroke="#333" stroke-width="3" />
        <path d="M195 160 L255 150" stroke="#333" stroke-width="3" />
        <path d="M195 170 L260 175" stroke="#333" stroke-width="3" />

    </svg>

</body>
</html>
